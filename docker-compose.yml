services:
  # Re-run the full training pipeline inside the container:
  #   docker compose run --rm pipeline
  pipeline:
    build: .
    image: nse-forecast:latest
    command: ["python", "-m", "nse.pipeline"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    profiles: ["train"]

  # Serve forecasts:  docker compose up --build api   ->  http://localhost:8000/docs
  api:
    build: .
    image: nse-forecast:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
