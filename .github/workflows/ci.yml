name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Train on synthetic data so the image has models
        run: |
          python scripts/make_sample_data.py --out data/raw --start 2021 --end 2026
          PYTHONPATH=src python -m nse.pipeline
      - run: docker build -t nse-forecast .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name api nse-forecast
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/forecast | head -c 400
